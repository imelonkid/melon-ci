# 可复用的 PR 检查（melon-ops 开发发布平台 P4.1）。项目里这样调用：
#
#   jobs:
#     check:
#       uses: imelonkid/melon-ci/.github/workflows/pr-check.yml@v2
#
# 约定（项目不用传参数，按文件是否存在决定做什么）：
#   scripts/ci-test.sh   存在就跑：项目自己的测试入口（单元测试、服务端冒烟……），失败即红
#   deploy/Dockerfile    存在就构建镜像（不推送）；deploy/prepare-context.sh 存在就先准备构建上下文（同 deploy.sh）
# 私有包（@imelonkid/common，GitHub Packages）：测试与镜像构建都带读包令牌——
#   测试步骤有环境变量 NODE_AUTH_TOKEN（项目的 .npmrc 引用它）；镜像构建传 BuildKit secret npm_token
#   （Dockerfile：RUN --mount=type=secret,id=npm_token NODE_AUTH_TOKEN=$(cat /run/secrets/npm_token) npm ci）
# 另外始终检查：本次新增的提交里有没有密钥（gitleaks）、项目是否符合运维规范（melon-skills 的 project-init check.sh）
name: pr-check

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"

permissions:
  contents: read
  packages: read        # 读私有包（仓库默认令牌就有，不用调用方额外授予）

env:
  GITLEAKS_VERSION: "8.30.1"

# 显式用 bash：GitHub 会带上 -eo pipefail，管道里任何一步失败整个步骤就失败（默认 shell 不带 pipefail，
# 「脚本 | tee 摘要」会把脚本失败吞掉——2026-10-19 小程序上传失败却显示成功）
defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: 密钥扫描
    concurrency:        # 同一个 PR 有新推送：取消还没跑完的旧检查，只跑最新的（推送到 main 的不取消：发布门禁要看 main 每个提交的结果）
      group: pr-check-secrets-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: gitleaks（只扫本次新增的提交）
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BASE" 2>/dev/null; then
            RANGE="$BASE..$HEAD"
          else
            RANGE="$HEAD"
          fi
          echo "扫描范围：$RANGE"
          ./gitleaks git . --redact --no-banner --log-opts="$RANGE" --exit-code 1

  standard:
    name: 运维规范
    concurrency:        # 同一个 PR 有新推送：取消还没跑完的旧检查，只跑最新的（推送到 main 的不取消：发布门禁要看 main 每个提交的结果）
      group: pr-check-standard-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v5
        with: { repository: imelonkid/melon-skills, path: .melon-skills }
      - name: project-init check.sh
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          echo ".melon-skills/" >> .git/info/exclude
          # CI 里没有私有运维仓库：注册表相关的检查会显示 △，不影响结果；✗ 才失败
          bash .melon-skills/skills/project-init/scripts/check.sh . "${{ github.event.repository.name }}"

  test:
    name: 测试
    concurrency:        # 同一个 PR 有新推送：取消还没跑完的旧检查，只跑最新的（推送到 main 的不取消：发布门禁要看 main 每个提交的结果）
      group: pr-check-test-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: has
        run: '[[ -f scripts/ci-test.sh ]] && echo yes=1 >> "$GITHUB_OUTPUT" || echo "没有 scripts/ci-test.sh，跳过"'
      - if: steps.has.outputs.yes == '1'
        uses: actions/setup-node@v5
        with: { node-version: "${{ inputs.node-version }}" }
      - if: steps.has.outputs.yes == '1'
        env: { NODE_AUTH_TOKEN: "${{ github.token }}" }
        run: corepack enable && bash scripts/ci-test.sh

  image:
    name: 镜像构建
    concurrency:        # 同一个 PR 有新推送：取消还没跑完的旧检查，只跑最新的（推送到 main 的不取消：发布门禁要看 main 每个提交的结果）
      group: pr-check-image-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: has
        run: '[[ -f deploy/Dockerfile ]] && echo yes=1 >> "$GITHUB_OUTPUT" || echo "没有 deploy/Dockerfile，跳过"'
      - if: steps.has.outputs.yes == '1'
        name: 构建（与 deploy.sh 同一套上下文准备，不推送）
        env: { NODE_AUTH_TOKEN: "${{ github.token }}" }
        run: |
          SRC="$(mktemp -d)"; git archive HEAD | tar -x -C "$SRC"
          TAG="ci-${GITHUB_SHA::8}"
          CTX="$SRC"; DOCKERFILE="$SRC/deploy/Dockerfile"
          if [[ -f "$SRC/deploy/prepare-context.sh" ]]; then source "$SRC/deploy/prepare-context.sh"; fi
          ( umask 077; printf '%s' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npm_token" )
          docker build -f "$DOCKERFILE" --build-arg APP_VERSION="$TAG" --secret id=npm_token,src="$RUNNER_TEMP/npm_token" -t "ci:$TAG" "$CTX"
          docker image ls "ci:$TAG"
