# 可复用：查看线上版本与最近的部署事件（只读）。
name: server-status
on:
  workflow_call:
    inputs:
      service: { type: string, required: true }
permissions:
  contents: read
# 显式用 bash：GitHub 会带上 -eo pipefail，管道里任何一步失败整个步骤就失败（默认 shell 不带 pipefail，
# 「脚本 | tee 摘要」会把脚本失败吞掉——2026-10-19 小程序上传失败却显示成功）
defaults:
  run:
    shell: bash

jobs:
  status:
    name: 状态
    runs-on: ubuntu-latest
    environment: production
    steps:
      - env: { KEY: "${{ secrets.DEPLOY_SSH_KEY }}", KH: "${{ vars.DEPLOY_KNOWN_HOSTS }}", H: "${{ vars.DEPLOY_HOST }}" }
        run: |
          install -d -m 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy; printf '%s\n' "$KH" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$H" status "${{ inputs.service }}" | tee -a "$GITHUB_STEP_SUMMARY"
